services:
  - type: web
    name: lior-finance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com 